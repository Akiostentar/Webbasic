<!DOCTYPE html>
<html lang='en'>
    
<head>
    <meta charset='utf-8'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Webbasic</title>
    <link rel='stylesheet' href='main.css'>
    <script src="main.js" defer></script>
<body>
    <h1>Welcome to Webbasic!</h1>
    <!-- <p>to start using Webbasic, import some mp3 files bellow:</p> -->
    <!-- <label for="audio-upload">Choose an audio file:</label>
    <input type="file" id="audio-upload" accept="audio/*"> -->

    <div id="music-player">
        <img id="song-cover" src="Music\that band cover.jpg">
        <div id="song-name">Song Name</div>
        <div id="song-artist">Artist Name</div>

        <input id="slider-song" type="range">
        <div id="music-buttons">
            <i id="shuffle-song" class="fa-solid fa-shuffle"></i>
            <i id="prev-song" class="fa-solid fa-backward-step fa-2x" ></i>
            <i id="playpause-song" class="fa-solid fa-play fa-3x"></i>
            <i id="next-song" class="fa-solid fa-forward-step fa-2x"></i>
            <i id="repeat-song" class="fa-solid fa-repeat"></i>
        </div>
    </div> 
</body>
</html>
